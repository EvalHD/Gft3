name: ZIP entpacken und APK bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ZIP entpacken
        run: |
          if [ -f LokalKI.zip ]; then
            unzip -o LokalKI.zip -d .
            rm LokalKI.zip
            echo "ENTPACKT=true" >> "$GITHUB_ENV"
          else
            echo "Keine LokalKI.zip gefunden, baue den vorhandenen Quellcode."
          fi

      - name: Entpackten Quellcode ins Repo zurückschreiben
        if: env.ENTPACKT == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Quellcode aus ZIP entpackt [skip ci]"
          git push

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Debug-APK bauen
        run: gradle :app:assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: LokalKI-APK
          path: app/build/outputs/apk/debug/*.apk
